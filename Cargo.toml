# li 语言编译器前端的工作区配置。
[workspace]
resolver = "2"
members = [
    "crates/li-ast",
    "crates/li-errors",
    "crates/li-lexer",
    "crates/li-parser",
    "crates/li-sema",
    "crates/li-ir",
    "crates/li-codegen-js",
    "crates/li-codegen-bytecode",
    "crates/li-codegen-html",
    "crates/li-codegen-llvm",
    "crates/li-vm",
    "crates/li-package",
    "crates/li-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["li 语言项目贡献者"]

[workspace.dependencies]
li-ast = { path = "crates/li-ast" }
li-errors = { path = "crates/li-errors" }
li-lexer = { path = "crates/li-lexer" }
li-parser = { path = "crates/li-parser" }
li-sema = { path = "crates/li-sema" }
li-ir = { path = "crates/li-ir" }
li-codegen-js = { path = "crates/li-codegen-js" }
li-codegen-bytecode = { path = "crates/li-codegen-bytecode" }
li-codegen-html = { path = "crates/li-codegen-html" }
li-codegen-llvm = { path = "crates/li-codegen-llvm" }
li-vm = { path = "crates/li-vm" }
li-package = { path = "crates/li-package" }

# M12.5 内置高级标准库（宿主桥接）依赖。
# VM 端借用这些顶级 Rust crate，JS 端映射到对应原生 API。
base64 = "0.22.1"
regex = "1.10"
serde_json = "1.0"
sha2 = "0.10"
ureq = "2.10"

# M14 项目配置与依赖锁文件；保留声明顺序便于稳定生成摘要与锁文件。
toml = { version = "0.8", features = ["preserve_order"] }

# 编译器不依赖 unsafe 代码；后续若确有必要，应在局部显式豁免并说明原因。
[workspace.lints.rust]
unsafe_code = "forbid"
